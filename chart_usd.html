<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シーゲル教授チャート（USD実質）</title>
<script src="chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-size:13px;color:#222;background:#fff}
.wrap{display:flex;flex-direction:column;height:100%;padding:10px 14px 6px;gap:4px;overflow:hidden}
h2{font-size:13px;font-weight:700;color:#111;line-height:1.35;flex-shrink:0}
.controls{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.ctrl-row{display:flex;align-items:center;gap:8px;font-size:11.5px}
.ctrl-row label{width:76px;flex-shrink:0;color:#555}
.ctrl-row input[type=range]{flex:1;accent-color:#3a6fd8;cursor:pointer}
.year-val{font-weight:700;color:#d43030;min-width:32px}
.chart-subtitle{text-align:center;font-size:10.5px;color:#666;flex-shrink:0}
.legend-wrap{display:flex;flex-wrap:wrap;gap:3px 10px;justify-content:center;flex-shrink:0}
.leg{display:flex;align-items:center;gap:4px;font-size:10.5px;cursor:pointer;padding:2px 5px;border-radius:3px;user-select:none;transition:opacity .15s}
.leg:hover{background:#f0f0f0}
.leg.off{opacity:.3;text-decoration:line-through}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chart-wrap{flex:1;min-height:0;position:relative}
.chart-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%}
@media(max-width:520px){
  html,body{font-size:11px}
  .wrap{padding:7px 10px 5px;gap:3px}
  h2{font-size:11px}
  .ctrl-row label{width:60px}
  .leg{font-size:9.5px}
}
.disclaimer{font-size:9px;color:#666;border-top:1px dashed #ccc;padding:4px 2px 2px;line-height:1.55;flex-shrink:0;margin-top:2px}
.disclaimer strong{color:#444;font-size:9.5px}
.disclaimer .risk-list{margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px}
.disclaimer .risk-item{white-space:nowrap}
@media(max-width:520px){.disclaimer{font-size:8px}}
</style>
</head>
<body>
<div class="wrap">
  <h2>米国・主要資産クラスの実質累積リターン（1950–2050）</h2>
  <div class="controls">
    <div class="ctrl-row">
      <label>開始年：</label>
      <input type="range" id="startSlider" min="1950" max="2049" value="1950" step="1">
      <span class="year-val" id="startLabel">1950</span>
    </div>
    <div class="ctrl-row">
      <label>終了年：</label>
      <input type="range" id="endSlider" min="1951" max="2050" value="2050" step="1">
      <span class="year-val" id="endLabel">2050</span>
    </div>
  </div>
  <div class="chart-subtitle">実質累積リターン指数（開始年=$1 に再ベース、1950年USD購買力）　凡例クリックで系列表示切替</div>
  <div class="legend-wrap" id="legend"></div>
  <div class="chart-wrap"><canvas id="myCanvas"></canvas></div>
  <div class="disclaimer">
    <strong>【2026〜2050年 予測の留保事項】</strong>
    本期間の数値は「現在の理解に基づく中央値シナリオ」であり、確定的な予測ではありません。
    <div class="risk-list">
      <span class="risk-item">①AI生産性効果（米国株：上振れ/下振れ両方向）</span>
      <span class="risk-item">②日本デフレ再来（JGB実質リターン再びマイナスへ）</span>
      <span class="risk-item">③地政学リスク（台湾・中東・米中関係）</span>
      <span class="risk-item">④円の構造変化（財政リスク顕在化→円安継続）</span>
    </div>
    本資料は教育目的のシミュレーションです。投資判断の根拠として利用することは推奨しません。
  </div>
</div>
<script>
// ── 対数線形補間でマイルストーンから年次データを生成 ────────────
function makeSeries(ms) {
  const out = [];
  for (let y = 1950; y <= 2050; y++) {
    if (y <= ms[0][0]) { out.push(ms[0][1]); continue; }
    if (y >= ms[ms.length-1][0]) { out.push(ms[ms.length-1][1]); continue; }
    let lo, hi;
    for (let i = 0; i < ms.length-1; i++) {
      if (ms[i][0] <= y && ms[i+1][0] >= y) { lo=ms[i]; hi=ms[i+1]; break; }
    }
    const t = (y-lo[0])/(hi[0]-lo[0]);
    out.push(Math.exp(Math.log(lo[1]) + t*(Math.log(hi[1])-Math.log(lo[1]))));
  }
  return out;
}

const MS = {
  usSt:  [[1950,1],[1955,2],[1960,3],[1965,4.5],[1970,3.9],[1973,2.8],[1975,3.5],[1980,4.2],[1987,7.5],[1989,10.5],[1990,10],[1995,17],[2000,32],[2002,21],[2007,37.5],[2009,22],[2015,57],[2020,105],[2022,82],[2025,120],[2030,142.5],[2035,181.9],[2040,243.4],[2045,333.5],[2050,456.9]],
  usLtb: [[1950,1],[1960,0.93],[1970,0.82],[1975,0.65],[1980,0.55],[1982,0.62],[1985,0.95],[1990,1.45],[1995,2.15],[2000,3.3],[2005,4.2],[2010,6.6],[2015,8.2],[2020,11.2],[2022,7.5],[2025,7.5],[2030,8.3],[2035,9.4],[2040,10.6],[2045,12.0],[2050,13.6]],
  usTb:  [[1950,1],[1960,1.01],[1970,0.96],[1975,0.86],[1980,0.92],[1985,1.08],[1990,1.18],[1995,1.3],[2000,1.48],[2005,1.58],[2010,1.5],[2015,1.47],[2020,1.44],[2022,1.42],[2025,1.46],[2030,1.53],[2035,1.61],[2040,1.70],[2045,1.78],[2050,1.87]],
  gold:  [[1950,1],[1960,0.96],[1971,0.95],[1972,1.22],[1975,2.55],[1980,5.6],[1982,3.8],[1985,3.2],[1990,2.6],[1995,2.1],[2000,1.8],[2002,2.15],[2005,3.3],[2008,5.6],[2012,8.1],[2015,5.9],[2020,8.6],[2022,8.1],[2025,8.5],[2030,9.16],[2035,9.39],[2040,9.39],[2045,9.39],[2050,9.39]],
  usDl:  [[1950,1],[1960,0.78],[1970,0.61],[1975,0.47],[1980,0.33],[1985,0.25],[1990,0.2],[1995,0.17],[2000,0.14],[2005,0.11],[2010,0.093],[2015,0.082],[2020,0.07],[2022,0.054],[2025,0.050],[2030,0.044],[2035,0.039],[2040,0.034],[2045,0.030],[2050,0.027]],
  jpYen: [[1950,1],[1955,0.93],[1960,0.79],[1965,0.7],[1970,0.62],[1971,0.7],[1975,0.56],[1980,0.54],[1985,0.38],[1987,0.6],[1990,0.54],[1995,0.72],[2000,0.55],[2005,0.47],[2010,0.52],[2012,0.53],[2015,0.34],[2020,0.35],[2022,0.25],[2025,0.235],[2030,0.207],[2035,0.187],[2040,0.169],[2045,0.153],[2050,0.142]],
  nk225: [[1950,1],[1955,3.5],[1960,7.2],[1965,9.8],[1970,15.5],[1975,22.5],[1980,36],[1985,52],[1987,122],[1989,410],[1990,285],[1992,180],[1995,192],[1998,158],[2000,192],[2003,112],[2007,195],[2009,118],[2012,142],[2015,148],[2018,205],[2020,188],[2022,172],[2025,180],[2030,224],[2035,293],[2040,383],[2045,501],[2050,654]],
  jgb:   [[1950,1],[1960,1.22],[1970,1.82],[1975,2.85],[1980,4.6],[1985,12.5],[1990,18.5],[1995,22.5],[2000,21.5],[2005,20.5],[2010,22.5],[2015,17.5],[2020,18.5],[2022,12.5],[2025,12.5],[2030,13.1],[2035,14.5],[2040,16.0],[2045,17.7],[2050,19.5]],
};

const SERIES = [
  {key:'usSt',  label:'米国株式',         color:'#cc2222'},
  {key:'usLtb', label:'米国長期債',        color:'#3366cc'},
  {key:'usTb',  label:'米国T-bill',       color:'#229944'},
  {key:'gold',  label:'金',               color:'#bb9900'},
  {key:'usDl',  label:'米ドル(現金)',     color:'#888888'},
  {key:'jpYen', label:'日本円(現金)',     color:'#dd66aa'},
  {key:'nk225', label:'日経225(配当込み)', color:'#ff22bb'},
  {key:'jgb',   label:'10年JGB(TR)',      color:'#119988'},
];

const allYears = Array.from({length:101},(_,i)=>1950+i);
const rawData  = SERIES.map(d=>makeSeries(MS[d.key]));
const hidden   = new Set();
let sy=1950, ey=2050;

function getSlice(sy,ey){
  const si=sy-1950, ei=ey-1950+1;
  return rawData.map(ser=>{
    const base=ser[si]||1;
    return ser.slice(si,ei).map(v=>v/base);
  });
}

// ── Chart初期化 ──────────────────────────────────────────────
window.addEventListener('load', function(){
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');
  const initSlices = getSlice(sy,ey);

  // 初期y軸範囲
  function calcYBounds(slices){
    let mn=Infinity,mx=-Infinity;
    slices.forEach((s,i)=>{
      if(hidden.has(i)) return;
      s.forEach(v=>{if(v>0){mn=Math.min(mn,v);mx=Math.max(mx,v);}});
    });
    if(!isFinite(mn)) return {min:0.01,max:1000};
    const pad=0.35;
    return{min:Math.pow(10,Math.log10(mn)-pad),max:Math.pow(10,Math.log10(mx)+pad)};
  }
  const initBounds = calcYBounds(initSlices);

  const myChart = new Chart(ctx, {
    type:'line',
    data:{
      labels: allYears.slice(),
      datasets: SERIES.map((d,i)=>({
        label:d.label,
        data:initSlices[i],
        borderColor:d.color,
        backgroundColor:d.color,
        borderWidth: i===6?2.2:1.8,
        pointRadius:0,
        pointHoverRadius:4,
        tension:0.2,
        fill:false,
        hidden:false,
      }))
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:{duration:150},
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(20,20,20,0.9)',
          titleColor:'#fff', bodyColor:'#ddd',
          padding:10, bodyFont:{size:11},
          callbacks:{
            label:c=>{
              if(hidden.has(c.datasetIndex)) return null;
              const v=c.raw;
              const f=v>=100?'$'+v.toFixed(1):v>=10?'$'+v.toFixed(2):v>=1?'$'+v.toFixed(3):'$'+v.toFixed(4);
              return '  '+c.dataset.label+': '+f;
            }
          }
        }
      },
      scales:{
        x:{
          ticks:{color:'#555',font:{size:10},maxTicksLimit:11,maxRotation:0},
          grid:{color:'rgba(0,0,0,0.07)'},border:{color:'#bbb'}
        },
        y:{
          type:'logarithmic',
          min:initBounds.min,
          max:initBounds.max,
          title:{display:true,text:'実質累積リターン（開始年=$1）',color:'#666',font:{size:10}},
          ticks:{
            color:'#555',font:{size:9},
            callback:v=>{
              const marks=[0.02,0.05,0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000];
              if(marks.some(m=>Math.abs(v-m)/m<0.02)) return v>=1?'$'+v:'$'+v.toFixed(2);
              return '';
            }
          },
          grid:{color:'rgba(0,0,0,0.07)'},border:{color:'#bbb'}
        }
      }
    }
  });

  // ── 凡例 ──────────────────────────────────────────────────
  const legWrap = document.getElementById('legend');
  SERIES.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='leg';
    el.innerHTML=`<div class="leg-dot" style="background:${d.color}"></div>${d.label}`;
    el.addEventListener('click',()=>{
      if(hidden.has(i)) hidden.delete(i); else hidden.add(i);
      el.classList.toggle('off', hidden.has(i));
      myChart.data.datasets[i].hidden=hidden.has(i);
      // 凡例トグル後もy軸再スケール
      const _cur=getSlice(sy,ey);
      let _mn2=Infinity,_mx2=-Infinity;
      _cur.forEach((s,j)=>{
        if(hidden.has(j)) return;
        s.forEach(v=>{if(v>0){_mn2=Math.min(_mn2,v);_mx2=Math.max(_mx2,v);}});
      });
      if(isFinite(_mn2)&&isFinite(_mx2)){
        const pad=0.35;
        myChart.options.scales.y.min=Math.pow(10,Math.log10(_mn2)-pad);
        myChart.options.scales.y.max=Math.pow(10,Math.log10(_mx2)+pad);
      }
      myChart.update('none');
    });
    legWrap.appendChild(el);
  });

  // ── スライダー ────────────────────────────────────────────
  function refresh(){
    const si=sy-1950, ei=ey-1950+1;
    const slices=getSlice(sy,ey);
    myChart.data.labels=allYears.slice(si,ei);
    SERIES.forEach((_,i)=>{
      myChart.data.datasets[i].data=slices[i];
      myChart.data.datasets[i].hidden=hidden.has(i);
    });
    // y軸オートスケール
    let _mn=Infinity,_mx=-Infinity;
    slices.forEach((s,i)=>{
      if(hidden.has(i)) return;
      s.forEach(v=>{ if(v>0){_mn=Math.min(_mn,v);_mx=Math.max(_mx,v);} });
    });
    if(isFinite(_mn)&&isFinite(_mx)){
      const pad=0.35;
      myChart.options.scales.y.min=Math.pow(10,Math.log10(_mn)-pad);
      myChart.options.scales.y.max=Math.pow(10,Math.log10(_mx)+pad);
    }
    myChart.update('none');
  }

  document.getElementById('startSlider').addEventListener('input',e=>{
    sy=parseInt(e.target.value);
    if(sy>=ey){sy=ey-1;e.target.value=sy;}
    document.getElementById('startLabel').textContent=sy;
    refresh();
  });
  document.getElementById('endSlider').addEventListener('input',e=>{
    ey=parseInt(e.target.value);
    if(ey<=sy){ey=sy+1;e.target.value=ey;}
    document.getElementById('endLabel').textContent=ey;
    refresh();
  });
});
</script>
</body>
</html>
