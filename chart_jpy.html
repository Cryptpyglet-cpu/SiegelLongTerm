<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シーゲル教授チャート（混合基準）</title>
<script src="chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-size:13px;color:#222;background:#fff}
.wrap{display:flex;flex-direction:column;height:100%;padding:10px 14px 6px;gap:4px;overflow:hidden}
h2{font-size:13px;font-weight:700;color:#111;line-height:1.35;flex-shrink:0}
.note-box{background:#fffbe6;border-left:4px solid #e0b800;padding:5px 10px;font-size:10px;color:#555;line-height:1.55;border-radius:2px;flex-shrink:0}
.note-box strong{color:#333}
.controls{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.ctrl-row{display:flex;align-items:center;gap:8px;font-size:11.5px}
.ctrl-row label{width:76px;flex-shrink:0;color:#555}
.ctrl-row input[type=range]{flex:1;accent-color:#3a6fd8;cursor:pointer}
.year-val{font-weight:700;color:#d43030;min-width:32px}
.chart-subtitle{text-align:center;font-size:10.5px;color:#666;flex-shrink:0}
.legend-wrap{display:flex;flex-wrap:wrap;gap:3px 8px;justify-content:center;flex-shrink:0}
.leg{display:flex;align-items:center;gap:4px;font-size:10.5px;cursor:pointer;padding:2px 5px;border-radius:3px;user-select:none;transition:opacity .15s}
.leg:hover{background:#f0f0f0}
.leg.off{opacity:.3;text-decoration:line-through}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.leg-badge{font-size:8.5px;color:#888;border:1px solid #ccc;border-radius:2px;padding:0 2px;margin-left:1px}
.chart-wrap{flex:1;min-height:0;position:relative}
.chart-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%}
@media(max-width:520px){
  html,body{font-size:11px}
  .wrap{padding:7px 10px 5px;gap:3px}
  h2{font-size:11px}
  .note-box{font-size:9px}
  .ctrl-row label{width:60px}
  .leg{font-size:9.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <h2>日本・主要資産クラスの実質累積リターン（1950–2050）</h2>
  <div class="note-box">
    <strong>混合基準：</strong>米国系列は1950年USD購買力、日経225・10年JGBは1950年JPY購買力で表示。同じグラフ上に異なる通貨単位を並べ、各国投資家の実質リターン体感を比較。
  </div>
  <div class="controls">
    <div class="ctrl-row">
      <label>開始年：</label>
      <input type="range" id="startSlider" min="1950" max="2049" value="1950" step="1">
      <span class="year-val" id="startLabel">1950</span>
    </div>
    <div class="ctrl-row">
      <label>終了年：</label>
      <input type="range" id="endSlider" min="1951" max="2050" value="2050" step="1">
      <span class="year-val" id="endLabel">2050</span>
    </div>
  </div>
  <div class="chart-subtitle">実質累積リターン指数（開始年=1 に再ベース）　凡例クリックで系列表示切替</div>
  <div class="legend-wrap" id="legend"></div>
  <div class="chart-wrap"><canvas id="myCanvas"></canvas></div>
</div>
<script>
function makeSeries(ms) {
  const out = [];
  for (let y = 1950; y <= 2050; y++) {
    if (y <= ms[0][0]) { out.push(ms[0][1]); continue; }
    if (y >= ms[ms.length-1][0]) { out.push(ms[ms.length-1][1]); continue; }
    let lo, hi;
    for (let i = 0; i < ms.length-1; i++) {
      if (ms[i][0] <= y && ms[i+1][0] >= y) { lo=ms[i]; hi=ms[i+1]; break; }
    }
    const t = (y-lo[0])/(hi[0]-lo[0]);
    out.push(Math.exp(Math.log(lo[1]) + t*(Math.log(hi[1])-Math.log(lo[1]))));
  }
  return out;
}

const MS_USD = {
  usSt:  [[1950,1],[1955,2],[1960,3],[1965,4.5],[1970,3.9],[1973,2.8],[1975,3.5],[1980,4.2],[1987,7.5],[1989,10.5],[1990,10],[1995,17],[2000,32],[2002,21],[2007,37.5],[2009,22],[2015,57],[2020,105],[2022,82],[2030,120],[2040,175],[2050,235]],
  usLtb: [[1950,1],[1960,0.93],[1970,0.82],[1975,0.65],[1980,0.55],[1982,0.62],[1985,0.95],[1990,1.45],[1995,2.15],[2000,3.3],[2005,4.2],[2010,6.6],[2015,8.2],[2020,11.2],[2022,7.5],[2030,8.5],[2040,9.8],[2050,11.5]],
  usTb:  [[1950,1],[1960,1.01],[1970,0.96],[1975,0.86],[1980,0.92],[1985,1.08],[1990,1.18],[1995,1.3],[2000,1.48],[2005,1.58],[2010,1.5],[2015,1.47],[2020,1.44],[2022,1.42],[2030,1.52],[2040,1.6],[2050,1.68]],
  gold:  [[1950,1],[1960,0.96],[1971,0.95],[1972,1.22],[1975,2.55],[1980,5.6],[1982,3.8],[1985,3.2],[1990,2.6],[1995,2.1],[2000,1.8],[2002,2.15],[2005,3.3],[2008,5.6],[2012,8.1],[2015,5.9],[2020,8.6],[2022,8.1],[2030,9.1],[2040,10],[2050,10.8]],
  usDl:  [[1950,1],[1960,0.78],[1970,0.61],[1975,0.47],[1980,0.33],[1985,0.25],[1990,0.2],[1995,0.17],[2000,0.14],[2005,0.11],[2010,0.093],[2015,0.082],[2020,0.07],[2022,0.054],[2030,0.044],[2040,0.034],[2050,0.026]],
  jpYen: [[1950,1],[1955,0.93],[1960,0.79],[1965,0.7],[1970,0.62],[1971,0.7],[1975,0.56],[1980,0.54],[1985,0.38],[1987,0.6],[1990,0.54],[1995,0.72],[2000,0.55],[2005,0.47],[2010,0.52],[2012,0.53],[2015,0.34],[2020,0.35],[2022,0.25],[2030,0.22],[2040,0.17],[2050,0.14]],
};
const MS_JPY = {
  nk225: [[1950,1],[1955,3],[1960,5.5],[1965,7.5],[1970,9.5],[1975,11],[1980,12.5],[1985,18],[1987,42],[1989,105],[1990,78],[1992,52],[1995,47],[1998,36],[2000,47],[2003,26],[2007,52],[2009,36],[2012,44],[2015,68],[2018,95],[2020,88],[2022,92],[2030,168],[2040,370],[2050,710]],
  jgb:   [[1950,1],[1960,0.84],[1970,0.74],[1975,0.63],[1980,0.68],[1985,1.18],[1990,1.75],[1995,2.45],[2000,3],[2005,3.45],[2010,3.95],[2015,4.48],[2020,4.95],[2022,4.75],[2030,4.45],[2040,4.78],[2050,5.05]],
};

const SERIES = [
  {key:'usSt',  label:'米国株式',         badge:'USD実質', color:'#cc2222', jpy:false},
  {key:'usLtb', label:'米国長期債',        badge:'USD実質', color:'#3366cc', jpy:false},
  {key:'usTb',  label:'米国T-bill',       badge:'USD実質', color:'#229944', jpy:false},
  {key:'gold',  label:'金',               badge:'USD実質', color:'#bb9900', jpy:false},
  {key:'usDl',  label:'米ドル(現金)',     badge:'USD実質', color:'#888888', jpy:false},
  {key:'jpYen', label:'日本円(現金)',     badge:'USD実質', color:'#dd66aa', jpy:false},
  {key:'nk225', label:'日経225(配当込み)', badge:'JPY実質', color:'#ff22bb', jpy:true},
  {key:'jgb',   label:'10年JGB(TR)',      badge:'JPY実質', color:'#119988', jpy:true},
];

const allYears = Array.from({length:101},(_,i)=>1950+i);
const rawData  = SERIES.map(d=>makeSeries(d.jpy ? MS_JPY[d.key] : MS_USD[d.key]));
const hidden   = new Set();
let sy=1950, ey=2050;

function getSlice(sy,ey){
  const si=sy-1950, ei=ey-1950+1;
  return rawData.map(ser=>{
    const base=ser[si]||1;
    return ser.slice(si,ei).map(v=>v/base);
  });
}

window.addEventListener('load', function(){
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');
  const initSlices = getSlice(sy,ey);

  const myChart = new Chart(ctx, {
    type:'line',
    data:{
      labels: allYears.slice(),
      datasets: SERIES.map((d,i)=>({
        label:d.label,
        data:initSlices[i],
        borderColor:d.color,
        backgroundColor:d.color,
        borderWidth: i===6?2.2:1.8,
        pointRadius:0,
        pointHoverRadius:4,
        tension:0.2,
        fill:false,
        hidden:false,
      }))
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:{duration:150},
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(20,20,20,0.9)',
          titleColor:'#fff', bodyColor:'#ddd',
          padding:10, bodyFont:{size:11},
          callbacks:{
            label:c=>{
              if(hidden.has(c.datasetIndex)) return null;
              const d=SERIES[c.datasetIndex];
              const v=c.raw;
              const sym=d.jpy?'¥':'$';
              const f=v>=100?sym+v.toFixed(1):v>=10?sym+v.toFixed(2):v>=1?sym+v.toFixed(3):sym+v.toFixed(4);
              return '  '+d.label+' ['+d.badge+']: '+f;
            }
          }
        }
      },
      scales:{
        x:{
          ticks:{color:'#555',font:{size:10},maxTicksLimit:11,maxRotation:0},
          grid:{color:'rgba(0,0,0,0.07)'},border:{color:'#bbb'}
        },
        y:{
          type:'logarithmic',
          min:0.01,
          title:{display:true,text:'実質累積リターン（開始年=1）',color:'#666',font:{size:10}},
          ticks:{
            color:'#555',font:{size:9},
            callback:v=>{
              const marks=[0.02,0.05,0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000];
              if(marks.some(m=>Math.abs(v-m)/m<0.02)) return v>=1?v.toFixed(0):v.toFixed(2);
              return '';
            }
          },
          grid:{color:'rgba(0,0,0,0.07)'},border:{color:'#bbb'}
        }
      }
    }
  });

  const legWrap = document.getElementById('legend');
  SERIES.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='leg';
    el.innerHTML=`<div class="leg-dot" style="background:${d.color}"></div>${d.label}<span class="leg-badge">${d.badge}</span>`;
    el.addEventListener('click',()=>{
      if(hidden.has(i)) hidden.delete(i); else hidden.add(i);
      el.classList.toggle('off', hidden.has(i));
      myChart.data.datasets[i].hidden=hidden.has(i);
      myChart.update('none');
    });
    legWrap.appendChild(el);
  });

  function refresh(){
    const si=sy-1950, ei=ey-1950+1;
    const slices=getSlice(sy,ey);
    myChart.data.labels=allYears.slice(si,ei);
    SERIES.forEach((_,i)=>{
      myChart.data.datasets[i].data=slices[i];
      myChart.data.datasets[i].hidden=hidden.has(i);
    });
    myChart.update('none');
  }

  document.getElementById('startSlider').addEventListener('input',e=>{
    sy=parseInt(e.target.value);
    if(sy>=ey){sy=ey-1;e.target.value=sy;}
    document.getElementById('startLabel').textContent=sy;
    refresh();
  });
  document.getElementById('endSlider').addEventListener('input',e=>{
    ey=parseInt(e.target.value);
    if(ey<=sy){ey=sy+1;e.target.value=ey;}
    document.getElementById('endLabel').textContent=ey;
    refresh();
  });
});
</script>
</body>
</html>
